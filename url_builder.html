<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Marker URL Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: sans-serif;
    background: linear-gradient(135deg, #1e1e1e, #2c2c2c);
    color: white;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(40, 40, 40, 0.95);
    padding: 20px;
    border-radius: 16px;

    box-shadow:
      0 10px 30px rgba(0,0,0,0.5),
      inset 0 0 10px rgba(255,255,255,0.05);

    backdrop-filter: blur(10px);
  }

  .card h2 {
    margin-top: 0;
    text-align: center;
  }

  label {
    font-size: 14px;
    color: #ccc;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 5px 0 15px;
    font-size: 16px;

    border-radius: 8px;
    border: none;

    background: #444;
    color: white;
  }

  input::placeholder {
    color: #bbb;
  }

  input:focus {
    outline: 2px solid #4CAF50;
    background: #555;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;

    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #generateBtn {
    background: #4CAF50;
    color: white;
  }

  #copyBtn {
    background: #2196F3;
    color: white;
  }

#output {
  background: #111;
  padding: 10px;
  border-radius: 8px;
  word-break: break-all;
  margin-top: 10px;
  margin-bottom: 10px;  /* 👈 เพิ่มตรงนี้ */
  font-size: 14px;
}
#openLink {
  display: block;
  width: 100%;
  padding: 12px;

  text-align: center;
  margin-top: 10px;

  border-radius: 10px;
  background: #4CAF50;
  color: white;

  text-decoration: none;
  font-size: 16px;
}

#openLink.disabled {
  opacity: 0.4;
  pointer-events: none;
}

  #openLink:hover {
    text-decoration: underline;
  }
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h2>AR Marker Builder</h2>

    <label>Name</label>
    <input id="name" placeholder="e.g. HS2AC">

    <label>Latitude</label>
    <input id="lat" placeholder="e.g. 13.189914">

    <label>Longitude</label>
    <input id="lon" placeholder="e.g. 100.950628">

    <label>Altitude (meters, optional)</label>
    <input id="alt" placeholder="e.g. 10">

    <!-- 1. Generate -->
    <button id="generateBtn">Generate URL</button>

    <!-- 2. URL display -->
    <div id="output">URL will appear here</div>

    <!-- 3. Copy -->
    <button id="copyBtn" disabled>Copy URL</button>

    <!-- 4. Open -->
    <a id="openLink" class="disabled" href="#" target="_blank">Open AR</a>

  </div>
</div>

<script>
  const baseURL = "https://menginventor.github.io/AR-Compass";

  const nameInput = document.getElementById("name");
  const latInput = document.getElementById("lat");
  const lonInput = document.getElementById("lon");
  const altInput = document.getElementById("alt");

  const output = document.getElementById("output");
  const openLink = document.getElementById("openLink");
  const copyBtn = document.getElementById("copyBtn");

  document.getElementById("generateBtn").onclick = () => {

    const name = encodeURIComponent(nameInput.value.trim());
    const lat = latInput.value.trim();
    const lon = lonInput.value.trim();
    const alt = altInput.value.trim();

    if (!lat || !lon) {
      alert("Latitude and Longitude required");
      return;
    }

    const params = new URLSearchParams();
    params.set("lat", lat);
    params.set("lon", lon);

    if (name) params.set("name", name);
    if (alt) params.set("alt", alt);

    const url = `${baseURL}?${params.toString()}`;

    // show URL
    output.textContent = url;

    // enable Copy
    copyBtn.disabled = false;

    // enable Open
    openLink.href = url;
    openLink.classList.remove("disabled");
  };

  copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(output.textContent);
      alert("Copied");
    } catch {
      alert("Copy failed");
    }
  };
</script>

</body>
</html>
